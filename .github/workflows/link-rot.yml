# Weekly link-rot watch: every cited source URL is checked over HTTP.
# Surveillance archives decay — this applies the lesson to ourselves.
# On failure it opens a triage issue (runner-provided vars only — nothing
# attacker-controlled is interpolated).
name: link-rot

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Check cited sources
        run: node scripts/check-links.mjs | tee link-report.txt

      # One standing issue: comment on it if it is still open, otherwise open it.
      # The body carries only the failing lines of our own script's output.
      - name: Report failures on the link-rot issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Weekly link check failed on $(date -u +%F). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            grep '✗' link-report.txt || true
            echo '```'
          } > body.md
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'link-rot: in:title' --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "link-rot: cited sources failing" --body-file body.md
          fi
