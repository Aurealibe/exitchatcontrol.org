# Local development only — NOT what production deploys.
#   docker compose -f docker-compose.dev.yml up dev       # HMR on :4321
#   docker compose -f docker-compose.dev.yml up preview   # prod-like on :8080
services:
  dev:
    image: node:26-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
    working_dir: /app
    command: sh -c "npm install -g \"$$(node -p \"require('./package.json').packageManager\")\" && pnpm install --frozen-lockfile && pnpm dev --host"
    ports:
      - '4321:4321'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - ASTRO_TELEMETRY_DISABLED=1

  preview:
    build: .
    ports:
      - '8080:80'

volumes:
  node_modules:
